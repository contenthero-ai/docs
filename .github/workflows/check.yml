name: Check

# Pushes to main publish straight to docs.contenthero.ai through the connected
# Mintlify project, so these checks run on the pull request, before anything is live.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  reference:
    name: Reference matches the published packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `.npmrc` reads the private @contenthero-ai scope (connect, which skills/install.mdx is generated
      # from) with NPM_TOKEN. GITHUB_TOKEN reads it once the package grants this repository Actions access.
      - run: npm install
        env:
          NPM_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      # ONE command, the same one run locally: currency (installed = published), the generated reference,
      # the generated skill install page, and tool names in hand-written pages. Listing the steps here
      # separately is how check:currency and check:skill-install existed for days without CI running them.
      - run: npm run check
        env:
          NPM_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
